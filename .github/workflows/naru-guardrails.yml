# .github/workflows/naru-guardrails.yml
name: N.A.R.U. Guardrails

on:
  push:
    branches: ["feat/opencode-plugin"]
  pull_request:
    branches: ["feat/opencode-plugin"]

jobs:
  guardrails:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build:plugin

      - name: Run deterministic guardrail tests
        run: bun run test:plugin

      - name: Run prompt spectrum benchmark
        run: bun run bench:prompts
